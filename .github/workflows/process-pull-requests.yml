# Runs the released deterministic pull-request processor on GitHub-hosted runners.
# No Group machine (laptop, cold-red-gate) is involved. This repository is PUBLIC so the
# runner minutes are free; it holds no source, only this explicit workflow. The processor is
# `process-github-pull-requests` from @red-cup-engineering/github-repository-hosting-service
# (source: red-cup-engineering/github-engineering-services-section, scripts/process-pull-requests.mjs).
#
# Credential: the Group's existing GitHub App, 561-group-github-services (installed on every org
# below with all repositories). Each org's job mints its own short-lived installation token,
# narrowed to what the processor uses: pull requests (labels, comments), contents read (workflow
# files, compare, the check rollup's state) and statuses read. Repository variable
# PR_PROCESSOR_APP_ID holds the App ID; repository secret PR_PROCESSOR_APP_KEY its private key.
#
# The issues job runs the same release's process-issues (dispositions completed, duplicate, in-progress, stale,
# open) with its own act flags: input issue-acts, else repository variable ISSUE_PROCESSOR_ACTS, else --label.
# Its public evidence is counts only, never repository names, issue numbers or titles.
#
# Act classes default to --label only. Widen with the repository variable PR_PROCESSOR_ACTS
# (e.g. "--label --comment"); no code change needed. update-branch and merge also need the
# contents permission below raised to write.
name: process pull requests

on:
  workflow_dispatch:
    inputs:
      acts:
        description: Act class flags (blank = repository variable PR_PROCESSOR_ACTS, else --label)
        type: string
        default: ''
      max-acts:
        description: Upper bound on acts per org this run
        type: string
        default: '100'
      issue-acts:
        description: Issue act class flags (blank = repository variable ISSUE_PROCESSOR_ACTS, else --label)
        type: string
        default: ''
      dry-run:
        description: Plan only, execute nothing
        type: boolean
        default: false
      generation:
        description: How many runs in a row this chain has continued (set by the continue job; 0 for a fresh run)
        type: string
        default: '0'

permissions: {}

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        org: [561-group, red-cup-engineering, coesite-operations, causeway-services, lenticule-science]
    concurrency:
      group: process-pull-requests-${{ matrix.org }}
      cancel-in-progress: false
    env:
      # The processor runs from its source at one pinned commit of the GitHub section (pure Node, no dependencies), so
      # a merged fix reaches the runner by changing this line, without waiting for a registry release.
      PROCESSOR_SOURCE: red-cup-engineering/github-engineering-services-section
      PROCESSOR_COMMIT: 'e38b3b362de1fbae20d1816bda7af888e95c0e06'
      ACTS: ${{ inputs.acts || vars.PR_PROCESSOR_ACTS || '--label' }}
      MAX_ACTS: ${{ inputs.max-acts || '100' }}
      DRY_RUN: ${{ inputs.dry-run && 'true' || 'false' }}
    steps:
      - name: Mint this org's installation token from the Group App
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PR_PROCESSOR_APP_ID }}
          private-key: ${{ secrets.PR_PROCESSOR_APP_KEY }}
          owner: ${{ matrix.org }}
          # contents write: the rebase act pushes a rebased head (leased on the classified commit) and merge lands it.
          permission-pull-requests: write
          permission-contents: write
          permission-statuses: read
          permission-checks: read
          permission-administration: write
      - name: Mint a read token for the processor's source
        id: source
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PR_PROCESSOR_APP_ID }}
          private-key: ${{ secrets.PR_PROCESSOR_APP_KEY }}
          owner: red-cup-engineering
          repositories: github-engineering-services-section
          permission-contents: read
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Fetch the processor's source at the pinned commit (scripts and src only, no history)
        env:
          SOURCE_TOKEN: ${{ steps.source.outputs.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          git init -q processor && cd processor
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$SOURCE_TOKEN" | base64 -w0)" \
            fetch -q --depth=1 --filter=blob:none "https://github.com/$PROCESSOR_SOURCE.git" "$PROCESSOR_COMMIT"
          git sparse-checkout set --no-cone /scripts/ /src/
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$SOURCE_TOKEN" | base64 -w0)" checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$PROCESSOR_COMMIT"
          printf '{"name":"%s","version":null,"commit":"%s"}\n' "$PROCESSOR_SOURCE" "$PROCESSOR_COMMIT" > "$RUNNER_TEMP/processor-source.json"
          echo "processor $PROCESSOR_SOURCE@$PROCESSOR_COMMIT"
      - name: Process ${{ matrix.org }} pull requests
        id: process
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          ORG: ${{ matrix.org }}
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/plan.json"
          if [ "$DRY_RUN" = "true" ]; then mode=""; else mode="--apply $ACTS --max-acts $MAX_ACTS"; fi
          status=0
          # shellcheck disable=SC2086
          node "$RUNNER_TEMP/processor/scripts/process-pull-requests.mjs" --org "$ORG" $mode --plan-out "$plan" > "$RUNNER_TEMP/processor-private-output.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$RUNNER_TEMP/processor-exit-code"
          exit "$status"
      - name: Receive public run evidence without private Work contents
        id: receipt
        if: ${{ always() }}
        env:
          ORG: ${{ matrix.org }}
          PROCESS_OUTCOME: ${{ steps.process.outcome }}
        run: |
          set -euo pipefail
          # Both the raw plan and raw output can name private repositories and PRs.
          # Publish a field allowlist only; never upload either original file.
          node <<'NODE'
          const fs = require('node:fs'), path = require('node:path');
          const file = name => path.join(process.env.RUNNER_TEMP, name);
          const read = name => { try { return { state: 'read', value: JSON.parse(fs.readFileSync(file(name), 'utf8')) }; }
            catch (error) { return { state: error.code === 'ENOENT' ? 'missing' : 'unreadable', value: null }; } };
          const integer = value => Number.isSafeInteger(value) && value >= 0 ? value : null;
          const match = (value, pattern) => typeof value === 'string' && pattern.test(value) ? value : null;
          const counts = (value, names) => Object.fromEntries(names.filter(name => integer(value?.[name]) !== null).map(name => [name, value[name]]));
          const observed = read('plan.json'), source = read('processor-source.json').value;
          const recognized = ['github.pull-request-plan.v1', 'github.pull-request-observation.v1'].includes(observed.value?.kind);
          const p = recognized ? observed.value : null;
          const owners = Array.isArray(p?.coverage?.owners) ? p.coverage.owners : [];
          const reasons = new Set(['partial-graphql-page', 'provider-read-failed', 'malformed-search-page', 'malformed-graphql-errors',
            'issue-count-changed', 'search-result-limit', 'page-budget-insufficient', 'anchor-stuck', 'malformed-pull', 'pull-outside-selected-scope',
            'duplicate-pull', 'missing-next-cursor', 'cursor-cycle', 'page-limit', 'page-size-exceeded', 'issue-count-mismatch']);
          const reasonCounts = list => { const out = {}; for (const reason of list) {
            const code = reasons.has(reason?.code) ? reason.code : 'unrecognized'; out[code] = (out[code] ?? 0) + 1;
          } return out; };
          const attempts = owners.flatMap(owner => Array.isArray(owner?.attempts) ? owner.attempts : []);
          const outcome = ['success', 'failure', 'cancelled', 'skipped'].includes(process.env.PROCESS_OUTCOME) ? process.env.PROCESS_OUTCOME : 'unknown';
          let exitCode = null;
          try { const value = fs.readFileSync(file('processor-exit-code'), 'utf8').trim(); if (/^[0-9]{1,3}$/.test(value) && Number(value) <= 255) exitCode = Number(value); } catch {}
          const runId = match(process.env.GITHUB_RUN_ID, /^[0-9]+$/), attempt = match(process.env.GITHUB_RUN_ATTEMPT, /^[0-9]+$/);
          const org = ['561-group', 'red-cup-engineering', 'coesite-operations', 'causeway-services', 'lenticule-science'].includes(process.env.ORG) ? process.env.ORG : null;
          const repository = 'red-cup-engineering/pull-request-processor-runner';
          const receipt = { kind: 'github.pull-request-run-receipt.v1', visibility: 'public-aggregate', generatedAt: new Date().toISOString(),
            runner: { repository, runId, attempt, headSha: match(process.env.GITHUB_SHA, /^[0-9a-f]{40}$/i), organization: org,
              runUrl: runId ? `https://github.com/${repository}/actions/runs/${runId}` : null },
            processor: { name: match(source?.name, /^[a-z0-9-]+\/[a-z0-9_.-]+$/i), commit: match(source?.commit, /^[0-9a-f]{40}$/i),
              version: match(source?.version, /^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/),
              tarballSha256: match(source?.tarballSha256, /^[0-9a-f]{64}$/i), node: process.version },
            execution: { outcome, exitCode, dryRun: process.env.DRY_RUN === 'true',
              receiptState: recognized ? p.kind : observed.state === 'read' ? 'unrecognized' : observed.state },
            coverage: { complete: typeof p?.coverage?.complete === 'boolean' ? p.coverage.complete : null,
              selectedScopes: owners.length, attempts: attempts.length,
              reasons: reasonCounts(owners.flatMap(owner => Array.isArray(owner?.reasons) ? owner.reasons : [])),
              attemptReasons: reasonCounts(attempts.flatMap(item => Array.isArray(item?.reasons) ? item.reasons : [])) },
            counts: { open: integer(p?.summary?.open), observedPulls: integer(p?.observedPulls), requests: integer(p?.requests),
              byDisposition: counts(p?.summary?.byDisposition, ['superseded', 'dependabot', 'conflicting', 'checks-failing', 'failing-on-base-too', 'unknown', 'draft-unverified', 'draft-clean', 'no-checks', 'checks-pending', 'ready-clean']),
              applied: counts(p?.summary?.appliedByStatus, ['applied', 'skipped', 'refused', 'deferred', 'error']) } };
          const text = JSON.stringify(receipt, null, 2) + '\n';
          fs.writeFileSync(file('pr-processor-public-receipt.json'), text);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'ready=true\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Pull-request processor: ${org ?? 'unknown'}\n\n\`\`\`json\n${text}\`\`\`\n`);
          process.stdout.write(text);
          NODE
      - name: Retain sanitized processing receipt
        if: ${{ always() && steps.receipt.outputs.ready == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-processor-${{ matrix.org }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr-processor-public-receipt.json
          if-no-files-found: error
          retention-days: 14

  issues:
    # Runs when repository variable ISSUE_PROCESSOR_ENABLED is true (the Group App holds Issues read and write since
    # 2026-11-01 in all five organizations).
    if: ${{ vars.ISSUE_PROCESSOR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        org: [561-group, red-cup-engineering, coesite-operations, causeway-services, lenticule-science]
    concurrency:
      group: process-issues-${{ matrix.org }}
      cancel-in-progress: false
    env:
      PROCESSOR_SOURCE: red-cup-engineering/github-engineering-services-section
      PROCESSOR_COMMIT: 'e38b3b362de1fbae20d1816bda7af888e95c0e06'
      ACTS: ${{ inputs.issue-acts || vars.ISSUE_PROCESSOR_ACTS || '--label' }}
      MAX_ACTS: ${{ inputs.max-acts || '100' }}
      DRY_RUN: ${{ inputs.dry-run && 'true' || 'false' }}
    steps:
      - name: Mint this org's installation token from the Group App
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PR_PROCESSOR_APP_ID }}
          private-key: ${{ secrets.PR_PROCESSOR_APP_KEY }}
          owner: ${{ matrix.org }}
          permission-issues: write
          permission-contents: read
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Mint a read token for the processor's source
        id: source
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PR_PROCESSOR_APP_ID }}
          private-key: ${{ secrets.PR_PROCESSOR_APP_KEY }}
          owner: red-cup-engineering
          repositories: github-engineering-services-section
          permission-contents: read
      - name: Fetch the processor's source at the pinned commit (scripts and src only, no history)
        env:
          SOURCE_TOKEN: ${{ steps.source.outputs.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          git init -q processor && cd processor
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$SOURCE_TOKEN" | base64 -w0)"
          git -c http.extraheader="$header" fetch -q --depth=1 --filter=blob:none "https://github.com/$PROCESSOR_SOURCE.git" "$PROCESSOR_COMMIT"
          git sparse-checkout set --no-cone /scripts/ /src/
          git -c http.extraheader="$header" checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$PROCESSOR_COMMIT"
          echo "processor $PROCESSOR_SOURCE@$PROCESSOR_COMMIT"
      - name: Process ${{ matrix.org }} issues
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          ORG: ${{ matrix.org }}
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/issue-plan.json"
          if [ "$DRY_RUN" = "true" ]; then mode=""; else mode="--apply $ACTS --max-acts $MAX_ACTS"; fi
          # shellcheck disable=SC2086
          node "$RUNNER_TEMP/processor/scripts/process-issues.mjs" --org "$ORG" $mode --plan-out "$plan" > "$RUNNER_TEMP/issue-processor-private-output.log" 2>&1
      - name: Publish counts only
        if: ${{ always() }}
        env:
          ORG: ${{ matrix.org }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs'), path = require('node:path');
          let p = null; try { p = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'issue-plan.json'), 'utf8')); } catch {}
          const integer = value => Number.isSafeInteger(value) && value >= 0 ? value : null;
          const counts = (value, names) => Object.fromEntries(names.filter(name => integer(value?.[name]) !== null).map(name => [name, value[name]]));
          const org = ['561-group', 'red-cup-engineering', 'coesite-operations', 'causeway-services', 'lenticule-science'].includes(process.env.ORG) ? process.env.ORG : null;
          const receipt = { kind: 'github.issue-run-receipt.v1', visibility: 'public-aggregate', organization: org, dryRun: process.env.DRY_RUN === 'true',
            planKind: ['github.issue-plan.v1', 'github.issue-observation.v1'].includes(p?.kind) ? p.kind : null,
            complete: typeof p?.coverage?.complete === 'boolean' ? p.coverage.complete : null,
            open: integer(p?.summary?.open), requests: integer(p?.requests),
            byDisposition: counts(p?.summary?.byDisposition, ['completed', 'duplicate', 'in-progress', 'stale', 'open']),
            applied: counts(p?.summary?.appliedByStatus, ['applied', 'skipped', 'refused', 'deferred', 'error']) };
          const text = JSON.stringify(receipt, null, 2) + '\n';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Issue processor: ${org ?? 'unknown'}\n\n\`\`\`json\n${text}\`\`\`\n`);
          process.stdout.write(text);
          NODE

  # Event-driven continuation, not a schedule: a run whose acts changed something (a merge moves a base, a rebase
  # starts checks, a close changes duplicates) is itself the event for the next run, which reads the new state. The
  # chain stops at a fixed point, the first run that applies nothing. GitHub's own auto-merge lands rebased pull
  # requests when their checks pass, which no run has to wait for.
  continue:
    needs: [process]
    if: ${{ always() && !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Read this run's public receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: pr-processor-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: receipts
      - name: Dispatch the next run when this one changed something
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATION: ${{ inputs.generation || '0' }}
          ACTS_INPUT: ${{ inputs.acts }}
          ISSUE_ACTS_INPUT: ${{ inputs.issue-acts }}
          MAX_ACTS_INPUT: ${{ inputs.max-acts }}
        run: |
          set -euo pipefail
          applied=$(jq -s 'map(.counts.applied.applied // 0) | add // 0' receipts/*/pr-processor-public-receipt.json)
          echo "applied acts this run: $applied (generation $GENERATION)"
          if [ "$applied" -gt 0 ]; then
            gh workflow run process-pull-requests.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
              -f acts="$ACTS_INPUT" -f issue-acts="$ISSUE_ACTS_INPUT" -f max-acts="${MAX_ACTS_INPUT:-100}" -f generation="$((GENERATION + 1))"
            echo "### Continued: generation $((GENERATION + 1)) dispatched ($applied acts applied)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Fixed point: no act applied; the chain stops" >> "$GITHUB_STEP_SUMMARY"
          fi

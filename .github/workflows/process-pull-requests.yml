# Runs the released deterministic pull-request processor on GitHub-hosted runners.
# No Group machine (laptop, cold-red-gate) is involved. This repository is PUBLIC so the
# runner minutes are free; it holds no source, only this schedule. The processor is
# `process-github-pull-requests` from @red-cup-engineering/github-repository-hosting-service
# (source: red-cup-engineering/github-engineering-services-section, scripts/process-pull-requests.mjs).
#
# Credential: the Group's existing GitHub App, 561-group-github-services (installed on every org
# below with all repositories). Each org's job mints its own short-lived installation token,
# narrowed to what the processor uses: pull requests (labels, comments), contents read (workflow
# files, compare, the check rollup's state) and statuses read. Repository variable
# PR_PROCESSOR_APP_ID holds the App ID; repository secret PR_PROCESSOR_APP_KEY its private key.
#
# Act classes default to --label only. Widen with the repository variable PR_PROCESSOR_ACTS
# (e.g. "--label --comment"); no code change needed. update-branch and merge also need the
# contents permission below raised to write.
name: process pull requests

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      acts:
        description: Act class flags (blank = repository variable PR_PROCESSOR_ACTS, else --label)
        type: string
        default: ''
      max-acts:
        description: Upper bound on acts per org this run
        type: string
        default: '100'
      dry-run:
        description: Plan only, execute nothing
        type: boolean
        default: false

permissions: {}

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        org: [561-group, red-cup-engineering, coesite-operations, causeway-services, lenticule-science]
    concurrency:
      group: process-pull-requests-${{ matrix.org }}
      cancel-in-progress: false
    env:
      PROCESSOR_PACKAGE: '@red-cup-engineering/github-repository-hosting-service'
      PROCESSOR_REGISTRY: https://registry.561.group/
      ACTS: ${{ inputs.acts || vars.PR_PROCESSOR_ACTS || '--label' }}
      MAX_ACTS: ${{ inputs.max-acts || '100' }}
      DRY_RUN: ${{ inputs.dry-run && 'true' || 'false' }}
    steps:
      - name: Mint this org's installation token from the Group App
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PR_PROCESSOR_APP_ID }}
          private-key: ${{ secrets.PR_PROCESSOR_APP_KEY }}
          owner: ${{ matrix.org }}
          permission-pull-requests: write
          permission-contents: read
          permission-statuses: read
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Fetch the released processor (no dependencies to install)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          tarball="$(npm pack "$PROCESSOR_PACKAGE@latest" --registry "$PROCESSOR_REGISTRY" --silent --ignore-scripts)"
          mkdir processor && tar -xzf "$tarball" -C processor
          node -e 'console.log("processor", require("./processor/package/package.json").version)'
      - name: Process ${{ matrix.org }} pull requests
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          ORG: ${{ matrix.org }}
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/plan.json"
          if [ "$DRY_RUN" = "true" ]; then mode=""; else mode="--apply $ACTS --max-acts $MAX_ACTS"; fi
          # shellcheck disable=SC2086
          node "$RUNNER_TEMP/processor/package/scripts/process-pull-requests.mjs" --org "$ORG" $mode --plan-out "$plan"
          # Counts only: this repository's logs are public and many processed repositories are private.
          counts="$(node -e 'const p=require(process.argv[1]); console.log(JSON.stringify({org:process.env.ORG,dryRun:p.dryRun,open:p.summary.open,byDisposition:p.summary.byDisposition,applied:p.summary.appliedByStatus??null,requests:p.requests}))' "$plan")"
          echo "$counts"
          { echo "### Pull-request processor: $ORG"; echo '```json'; echo "$counts"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
